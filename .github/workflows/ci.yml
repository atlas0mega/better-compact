name: CI

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        # V2 host and published package compatibility can change independently.
        - cron: "17 6 * * *"

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10.13.1
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24
                  cache: pnpm
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14
            - run: pnpm install --frozen-lockfile
            - run: pnpm run typecheck
            - run: pnpm test
            - run: pnpm run build
            - run: pnpm run verify:package
            - run: curl -fsSL https://opencode.ai/install | bash -s -- --version 2.0.18 --no-modify-path
            - run: OPENCODE_BIN="$HOME/.opencode/bin/opencode" pnpm --filter better-compact run smoke:host
            - run: OPENCODE_BIN="$HOME/.opencode/bin/opencode" pnpm --filter better-compact run smoke:tui

    compatibility:
        needs: verify
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                opencode: ["2.0.18", "latest"]
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10.13.1
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            # Verify an installed tarball, not workspace-linked source.
            - name: Pack
              run: |
                  archive="$(cd packages/opencode && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
                  mv "$archive" "$RUNNER_TEMP/package.tgz"
            - name: Install minimum OpenCode
              if: matrix.opencode != 'latest'
              run: curl -fsSL https://opencode.ai/install | bash -s -- --version "${{ matrix.opencode }}" --no-modify-path
            - name: Install latest OpenCode
              if: matrix.opencode == 'latest'
              run: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
            - run: OPENCODE_BIN="$HOME/.opencode/bin/opencode" BETTER_COMPACT_SMOKE_SPEC="$RUNNER_TEMP/package.tgz" pnpm --filter better-compact run smoke:install

    published:
        # Nightly only: the release everyone already has installed has to keep
        # resolving against whatever OpenCode and OpenTUI shipped since.
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  version: 10.13.1
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
            - run: OPENCODE_BIN="$HOME/.opencode/bin/opencode" BETTER_COMPACT_SMOKE_SPEC="better-compact@latest" pnpm --filter better-compact run smoke:install
